<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diary">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#33357a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>English Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --font-serif:'Newsreader',Georgia,'Times New Roman',serif;
  --font-ui:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',Roboto,sans-serif;
  --bg:#fbfaf6; --surface:#ffffff; --surface-2:#f3f1ec;
  --ink:#1e2233; --muted:#6b6f7d; --line:#e6e2d8;
  --brand:#33357a; --brand-soft:#ecebf5; --on-brand:#ffffff;
  --del:#c0392b; --del-bg:#fbe9e7; --ins:#1f7a4d; --ins-bg:#e7f4ec;
  --save:#b7791f; --save-bg:#fbf1dc;
  --shadow:0 1px 2px rgba(30,34,51,.06),0 8px 24px rgba(30,34,51,.06);
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14151a; --surface:#1c1e26; --surface-2:#232630;
    --ink:#e9e8f0; --muted:#9aa0b0; --line:#2c2f3a;
    --brand:#a6a9f2; --brand-soft:#262a45; --on-brand:#14151a;
    --del:#ff8578; --del-bg:#3a2320; --ins:#66d19e; --ins-bg:#173026;
    --save:#e0a94a; --save-bg:#2e2717;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#14151a; --surface:#1c1e26; --surface-2:#232630;
  --ink:#e9e8f0; --muted:#9aa0b0; --line:#2c2f3a;
  --brand:#a6a9f2; --brand-soft:#262a45; --on-brand:#14151a;
  --del:#ff8578; --del-bg:#3a2320; --ins:#66d19e; --ins-bg:#173026;
  --save:#e0a94a; --save-bg:#2e2717;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:var(--font-ui);background:var(--bg);color:var(--ink);
  font-size:16px;line-height:1.5;overscroll-behavior-y:none;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
.serif{font-family:var(--font-serif)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);
  padding:calc(env(safe-area-inset-top) + 8px) 18px 8px;border-bottom:1px solid transparent;
  display:flex;align-items:center;gap:10px;min-height:52px}
.topbar.scrolled{border-bottom-color:var(--line)}
.topbar .back{font-size:15px;color:var(--brand);font-weight:600;display:flex;align-items:center;gap:2px;margin-left:-4px}
.topbar h1{font-size:17px;margin:0;font-weight:600;flex:1;text-align:center}
.topbar .spacer{width:44px}
.topbar .act{font-size:15px;color:var(--brand);font-weight:600}

/* view scroller */
.view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 18px calc(env(safe-area-inset-bottom) + 88px)}
.view.pad-top{padding-top:6px}

/* today */
.daymark{padding:14px 2px 6px}
.daymark .dow{font-family:var(--font-serif);font-size:40px;line-height:1.05;font-weight:500;letter-spacing:-.01em}
.daymark .date{color:var(--muted);font-size:14px;margin-top:2px}
.prompt{color:var(--muted);font-size:14px;margin:2px 2px 12px;font-style:italic;font-family:var(--font-serif)}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
textarea.entry{
  width:100%;min-height:46vh;border:none;outline:none;resize:none;background:transparent;color:var(--ink);
  font-family:var(--font-serif);font-size:19px;line-height:1.85;padding:18px;display:block;
}
textarea.entry::placeholder{color:var(--muted);opacity:.7}
.entry-foot{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
.saved-dot{color:var(--ins)}
.cta-row{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 62px);display:flex;justify-content:center;padding:0 18px;pointer-events:none;z-index:15}
.cta-row .inner{max-width:560px;width:100%;display:flex;gap:10px;pointer-events:auto}
.btn{flex:1;border-radius:13px;padding:15px 16px;font-size:16px;font-weight:600;text-align:center;transition:transform .06s ease}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);color:var(--on-brand);box-shadow:0 6px 18px color-mix(in srgb,var(--brand) 35%,transparent)}
.btn.ghost{background:var(--surface);color:var(--brand);border:1px solid var(--line);box-shadow:var(--shadow)}
.btn[disabled]{opacity:.5}

/* bottom tabs */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:18;background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabbar .inner{max-width:560px;margin:0 auto;width:100%;display:flex}
.tab{flex:1;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--brand)}

/* segmented */
.seg{display:flex;background:var(--surface-2);border-radius:11px;padding:3px;margin:14px 0 4px}
.seg button{flex:1;padding:8px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* compare */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.col{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.col h4{margin:0;font-size:11.5px;font-weight:700;color:var(--muted);padding:9px 12px 7px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.col .body{padding:12px;font-family:var(--font-serif);font-size:14.5px;line-height:1.85;word-break:break-word}
.col.after h4{color:var(--ins)}
.w{cursor:pointer;border-radius:3px}
.w:active{background:var(--brand-soft)}
.tok-del{color:var(--del);background:var(--del-bg);text-decoration:line-through;text-decoration-thickness:1px;border-radius:3px;padding:0 1px}
.tok-ins{color:var(--ins);background:var(--ins-bg);border-radius:3px;padding:0 1px}

/* correction cards */
.section-title{font-size:13px;font-weight:700;color:var(--muted);margin:20px 2px 8px;letter-spacing:.01em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:13px 14px;margin-bottom:10px}
.card .fixline{font-family:var(--font-serif);font-size:15.5px;line-height:1.6}
.card .fixline .o{color:var(--del);text-decoration:line-through;text-decoration-thickness:1px}
.card .fixline .arrow{color:var(--muted);margin:0 6px}
.card .fixline .c{color:var(--ins);font-weight:600}
.card .exp{color:var(--muted);font-size:13.5px;margin-top:7px}
.tag{display:inline-block;font-size:11px;font-weight:700;color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:2px 9px;margin-bottom:8px}
.savebtn{margin-top:10px;font-size:13px;font-weight:600;color:var(--save);background:var(--save-bg);border-radius:9px;padding:8px 12px;display:inline-flex;align-items:center;gap:5px}
.savebtn.done{color:var(--muted);background:var(--surface-2)}

/* quiz */
.qwrap .qhead{display:flex;justify-content:space-between;align-items:baseline;margin:14px 2px 6px}
.qhead .n{font-size:13px;color:var(--muted);font-weight:600}
.qhead .score{font-size:13px;color:var(--brand);font-weight:700}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 15px;margin-bottom:12px}
.qcard .q{font-size:15.5px;font-weight:600;margin-bottom:12px;line-height:1.5}
.qcard .q .serif{font-family:var(--font-serif)}
.opt{width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:11px;padding:12px 14px;margin-bottom:8px;font-size:15px;font-family:var(--font-serif);display:flex;gap:10px;align-items:center;transition:.12s}
.opt .k{font-family:var(--font-ui);font-size:12px;font-weight:700;color:var(--muted);width:18px;flex:none}
.opt.correct{border-color:var(--ins);background:var(--ins-bg)}
.opt.wrong{border-color:var(--del);background:var(--del-bg)}
.opt[disabled]{cursor:default}
.qexp{font-size:13.5px;color:var(--muted);margin-top:6px;padding:0 2px}
.qexp b{color:var(--ink)}

/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 2px 8px}
.calhead .m{font-family:var(--font-serif);font-size:23px;font-weight:600;min-width:0}
.calnav{display:flex;gap:6px;flex:none}
.calnav button{min-width:38px;height:38px;padding:0 12px;border-radius:11px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);font-size:15px;font-weight:600;color:var(--brand);white-space:nowrap}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dowh{text-align:center;font-size:11px;color:var(--muted);font-weight:600;padding:6px 0 2px;min-width:0}
.dowh.sun{color:var(--del)}
.cell{aspect-ratio:1;min-width:0;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px;position:relative;background:transparent;color:var(--ink)}
.cell.empty{visibility:hidden}
.cell.has{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.cell.today{outline:2px solid var(--brand);outline-offset:-2px}
.cell .dot{width:5px;height:5px;border-radius:50%;background:var(--brand)}
.cell .dot.checked{background:var(--ins)}
.cell.sun{color:var(--del)}

/* reader / lists */
.reader .rtext{font-family:var(--font-serif);font-size:17px;line-height:1.85;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin-top:12px;white-space:pre-wrap;word-break:break-word}
.listitem{background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);padding:13px 14px;margin-bottom:9px;display:flex;gap:10px;align-items:flex-start}
.listitem .main{flex:1;min-width:0}
.listitem .term{font-family:var(--font-serif);font-size:17px;font-weight:600}
.listitem .mean{color:var(--muted);font-size:13.5px;margin-top:2px}
.listitem .ex{color:var(--muted);font-size:12.5px;margin-top:5px;font-family:var(--font-serif);font-style:italic}
.listitem .meta{color:var(--muted);font-size:11px;margin-top:6px}
.listitem .del{color:var(--del);font-size:13px;padding:4px;align-self:center;flex:none}
.sent{font-family:var(--font-serif);font-size:15.5px;line-height:1.6}

/* empty */
.empty{text-align:center;color:var(--muted);padding:56px 24px}
.empty .em{font-size:34px}
.empty .t{font-size:16px;font-weight:600;color:var(--ink);margin-top:12px}
.empty .s{font-size:14px;margin-top:5px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(15,16,22,.4);z-index:40;opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:22px 22px 0 0;
  box-shadow:0 -8px 40px rgba(0,0,0,.2);transform:translateY(102%);transition:transform .26s cubic-bezier(.3,.9,.3,1);
  padding:8px 20px calc(env(safe-area-inset-bottom) + 22px);max-width:560px;margin:0 auto}
.sheet.show{transform:translateY(0)}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 12px}
.sheet .word{font-family:var(--font-serif);font-size:27px;font-weight:600}
.sheet .pos{color:var(--brand);font-size:13px;font-weight:600;margin-top:2px}
.sheet .ipa{color:var(--muted);font-size:13px;margin-left:8px;font-weight:400}
.sheet .def{font-size:16px;margin-top:12px}
.sheet .exen{font-family:var(--font-serif);font-size:15px;margin-top:12px;line-height:1.6}
.sheet .exko{color:var(--muted);font-size:13.5px;margin-top:3px}
.sheet .sactions{display:flex;gap:10px;margin-top:18px}
.sheet .sactions .btn{padding:13px}
.sheet .ctx{background:var(--surface-2);border-radius:11px;padding:11px 13px;margin-top:14px;font-family:var(--font-serif);font-size:14px;color:var(--muted);line-height:1.6}
.mini-load{color:var(--muted);font-size:14px;padding:18px 0;text-align:center}

/* overlay loader */
.loader{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--bg) 72%,transparent);
  backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.loader.show{display:flex}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--brand-soft);border-top-color:var(--brand);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loader .msg{color:var(--muted);font-size:14px}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(env(safe-area-inset-bottom) + 96px);
  background:var(--ink);color:var(--bg);font-size:13.5px;font-weight:600;padding:11px 18px;border-radius:999px;z-index:60;
  opacity:0;transition:.25s;pointer-events:none;max-width:88%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.notice{background:var(--save-bg);color:var(--ink);border:1px solid color-mix(in srgb,var(--save) 40%,transparent);border-radius:12px;padding:11px 13px;font-size:13px;margin:12px 0}
.rowbtns{display:flex;gap:8px;margin:12px 0 6px}
.rowbtns .btn{padding:12px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:6px 0}
.chip{font-size:13px;font-weight:600;color:var(--muted);background:var(--surface-2);border:1px solid transparent;border-radius:999px;padding:7px 13px}
.chip.on{color:var(--brand);background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 30%,transparent)}
.setup{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 13px;margin-top:14px}
.setup .lbl{font-size:12px;color:var(--muted);font-weight:700;margin:8px 2px 0}
.setup .lbl:first-child{margin-top:0}
.dsec h5{margin:16px 2px 6px;font-size:13px;color:var(--muted);font-weight:700}
.drow{display:flex;gap:8px;flex-wrap:wrap}
.dbtn{flex:1;min-width:92px;border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:13px 10px;font-size:13.5px;font-weight:600;text-align:center;color:var(--ink)}
.dbtn:active{transform:scale(.98)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="topbar" id="topbar">
    <button class="back" id="backBtn" style="display:none">‹ 뒤로</button>
    <div class="spacer" id="lspacer"></div>
    <h1 id="title">오늘</h1>
    <button class="act" id="topAct" style="display:none"></button>
    <div class="spacer" id="rspacer"></div>
  </div>
  <div class="view pad-top" id="view"></div>
</div>

<div class="cta-row" id="ctaRow" style="display:none"><div class="inner" id="ctaInner"></div></div>

<div class="tabbar" id="tabbar"><div class="inner">
  <button class="tab on" data-tab="today">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H16l4 4v10.5A1.5 1.5 0 0 1 18.5 20h-13A1.5 1.5 0 0 1 4 18.5z"/><path d="M8 9h6M8 12.5h8M8 16h5"/></svg>
    <span>오늘</span>
  </button>
  <button class="tab" data-tab="calendar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3"/></svg>
    <span>달력</span>
  </button>
  <button class="tab" data-tab="collection">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 4h11a2 2 0 0 1 2 2v14l-4-2.2L13 20l-3-2.2L6 20z"/></svg>
    <span>수집</span>
  </button>
</div></div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="loader" id="loader"><div class="spin"></div><div class="msg" id="loaderMsg">검사하고 있어요…</div></div>
<div class="toast" id="toast"></div>
<input type="file" id="csvFile" accept=".csv,text/csv" style="display:none">

<script>
"use strict";
/* ---------------- capability: sample (AI) ---------------- */
let SAMPLE=null;
(async()=>{ try{ if(window.claude&&claude.use){ SAMPLE=await claude.use("sample"); } }catch(e){} if(curTab==="today")renderToday(); })();
function getApiKey(){try{return (localStorage.getItem("endiary.apikey")||"").trim();}catch(e){return"";}}
function getProvider(){try{return localStorage.getItem("endiary.provider")||"gemini";}catch(e){return "gemini";}}
function defModel(p){return p==="openai"?"gpt-4o-mini":p==="gemini"?"gemini-2.0-flash":"claude-3-5-sonnet-20241022";}
function keyHelp(p){
  if(p==="openai")return '키 발급: <a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener" style="color:var(--brand)">platform.openai.com</a> ·';
  if(p==="gemini")return '키 발급: <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" style="color:var(--brand)">aistudio.google.com</a> ·';
  return '키 발급: <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener" style="color:var(--brand)">console.anthropic.com</a> ·';
}
function getModel(){try{const m=(localStorage.getItem("endiary.model")||"").trim();return m||defModel(getProvider());}catch(e){return defModel(getProvider());}}
function aiOn(){return !!SAMPLE || !!getApiKey();}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function _remoteJSON(prompt,key,tier){
  const provider=getProvider(), model=getModel();
  const instr=prompt+"\n\nReturn ONLY the JSON object. No markdown fences, no extra text.";
  async function readErr(res){let m="";try{const eb=await res.json();m=(eb.error&&eb.error.message)||"";}catch(_){}
    const retryable=res.status===429||res.status===503||res.status===500||/high demand|overload|unavailable|try again|rate|quota/i.test(m);
    return {code:res.status===429?"rate_limited":"http_"+res.status,message:m,retryable};}
  let txt="";
  if(provider==="openai"){
    const res=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+key},body:JSON.stringify({model,messages:[{role:"user",content:instr}],response_format:{type:"json_object"},max_tokens:1600})});
    if(!res.ok) throw await readErr(res);
    const d=await res.json(); txt=(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||"";
  }else if(provider==="gemini"){
    const cands=[model,"gemini-2.0-flash","gemini-1.5-flash","gemini-flash-latest"].filter((m,i,a)=>m&&a.indexOf(m)===i);
    let ok=null,lastErr=null;
    for(const mdl of cands){
      const res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(mdl)+":generateContent?key="+encodeURIComponent(key),{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:instr}]}]})});
      if(res.ok){ok=res;break;}
      lastErr=await readErr(res);
      if(res.status!==404) break;
    }
    if(!ok) throw (lastErr||{code:"error"});
    const d=await ok.json(); txt=(d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts&&d.candidates[0].content.parts[0]&&d.candidates[0].content.parts[0].text)||"";
  }else{
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model,max_tokens:1600,messages:[{role:"user",content:instr}]})});
    if(!res.ok) throw await readErr(res);
    const d=await res.json(); txt=(d.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
  }
  txt=(txt||"").trim().replace(/^```json/i,"").replace(/^```/,"").replace(/```$/,"").trim();
  const s=txt.indexOf("{"),e=txt.lastIndexOf("}"); if(s>=0&&e>=0)txt=txt.slice(s,e+1);
  if(!txt) throw {code:"empty",message:"AI가 빈 응답을 반환했어요"};
  return JSON.parse(txt);
}
async function askJSON(prompt,tier){
  if(SAMPLE){ return await SAMPLE.json(prompt,{modelTier:tier||"default",cache:false}); }
  const key=getApiKey(); if(!key) throw {code:"no_ai"};
  let lastErr=null;
  for(let attempt=0;attempt<3;attempt++){
    if(attempt>0) await sleep(1000*attempt+500);
    try{ return await _remoteJSON(prompt,key,tier); }
    catch(err){ lastErr=err; if(!err||!err.retryable) throw err; }
  }
  throw lastErr;
}

function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function toast(msg,ms){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),ms||1700);}
function showLoader(m){$("#loaderMsg").textContent=m||"불러오는 중…";$("#loader").classList.add("show");}

function cleanWord(w){return (w||"").replace(/^[^A-Za-z'’-]+|[^A-Za-z'’-]+$/g,"");}
function wrapWords(text){
  return esc(text).split(/(\s+)/).map(tok=>{
    if(/^\s+$/.test(tok)) return tok;
    const c=cleanWord(tok);
    if(!c) return tok;
    return `<span class="w" data-w="${esc(c)}">${tok}</span>`;
  }).join("");
}
function splitSentences(t){return (t.match(/[^.!?]+[.!?]*/g)||[t]).map(s=>s.trim()).filter(Boolean);}
function normPlain(s){return (s||"").toLowerCase().replace(/[.,!?;:'’"()\-\s]/g,"");}
function isMinorFix(o,c){ if(!o||!c) return false; return normPlain(o)===normPlain(c); }
function applyFix(e,orig,corr){ if(!e||!orig) return false; const t=e.text||""; const idx=t.indexOf(orig); if(idx<0) return false; e.text=t.slice(0,idx)+corr+t.slice(idx+orig.length); e.updatedAt=Date.now(); return true; }

/* ---------------- word diff (LCS) ---------------- */
function tokz(s){return (s||"").trim().split(/\s+/).filter(Boolean);}
function diffTokens(a,b){
  const n=a.length,m=b.length;
  const dp=Array.from({length:n+1},()=>new Int16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)
    dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const out=[];let i=0,j=0;
  while(i<n&&j<m){
    if(a[i]===b[j]){out.push(["eq",a[i]]);i++;j++;}
    else if(dp[i+1][j]>=dp[i][j+1]){out.push(["del",a[i]]);i++;}
    else{out.push(["ins",b[j]]);j++;}
  }
  while(i<n)out.push(["del",a[i++]]);
  while(j<m)out.push(["ins",b[j++]]);
  return out;
}
function renderDiffCol(diff,side){ // side: 'left'|'right'
  return diff.map(([t,w])=>{
    const c=cleanWord(w);
    const tap=c?`class="w" data-w="${esc(c)}"`:"";
    if(t==="eq")   return `<span ${tap}>${esc(w)}</span> `;
    if(t==="del"&&side==="left")  return `<span class="tok-del">${esc(w)}</span> `;
    if(t==="ins"&&side==="right") return `<span class="tok-ins ${c?"w":""}" ${c?`data-w="${esc(c)}"`:""}>${esc(w)}</span> `;
    return "";
  }).join("");
}

async function aiCheck(text){
  const prompt=
`You are an English writing tutor for a Korean learner keeping an English diary.
Correct the diary below for grammar, spelling, word choice, punctuation, and naturalness.
Preserve the writer's meaning and voice. Do NOT add new facts or ideas.
Return ONLY a JSON object with this exact shape:
{
 "corrected": "the full corrected diary text",
 "corrections": [
   {"original":"the exact wrong phrase from the diary","corrected":"the fixed phrase","type":"문법|철자|어휘|구두점|표현","explanation":"한국어로 한 문장 설명"}
 ],
 "quiz": [
   {"question":"한국어 지시문 또는 빈칸(___) 포함 영어 문장","options":["보기1","보기2","보기3","보기4"],"answer":0,"explain":"한국어 해설 한 문장"}
 ]
}
Rules: 'answer' is the 0-based index of the correct option. Apply ALL fixes (including capitalization, punctuation, spacing, apostrophes) silently in "corrected". But in "corrections" and "quiz", include ONLY meaningful errors: grammar, verb tense/form, articles, prepositions, word choice, word order, singular/plural, and missing or extra words. Do NOT list capitalization / punctuation / spacing / apostrophe-only changes. Make 3 to 6 quiz items based ONLY on those meaningful errors (test the correct form vs the learner's wrong form). If there are no meaningful errors, use "corrections":[] and "quiz":[]. Keep explanations in Korean, concise.
Diary:
"""${text}"""`;
  return await askJSON(prompt,"default");
}
async function aiDefine(word,ctx){

`Define the English word or phrase for a Korean learner. Return ONLY JSON:
{"word":"headword","pos":"품사(한국어: 명사/동사/형용사/부사/구 등)","ipa":"IPA or empty string","meaning":"한국어 뜻 (간결)","example":"a simple natural English example sentence","exampleKo":"예문의 한국어 번역"}
Word: "${word}"

}

function renderCollection(){
  curTab="collection"; setChrome({title:"수집",back:false,action:{label:"데이터",fn:openDataSheet}});
  $("#ctaRow").style.display="none";
  const v=DB.vocab,s=DB.sentences;
  view.innerHTML=`
    <div class="seg">
      <button data-ct="vocab" class="${collTab==="vocab"?"on":""}">단어장 ${v.length?`(${v.length})`:""}</button>
      <button data-ct="sent" class="${collTab==="sent"?"on":""}">문장수집 ${s.length?`(${s.length})`:""}</button>
    </div>
    <div id="collBody"></div>`;
  view.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{collTab=b.dataset.ct;renderCollection();});
  const body=$("#collBody");
  if(collTab==="vocab"){
    body.innerHTML=`
      <div class="rowbtns">
        <button class="btn primary" id="startTest">단어 시험 보기</button>
      </div>`+
      (v.length? v.map((x,i)=>`
      <div class="listitem">
        <div class="main">
          <div class="term">${esc(x.word)} ${x.pos?`<span style="font-size:12px;color:var(--brand);font-weight:600">· ${esc(x.pos)}</span>`:""}</div>
          <div class="mean">${esc(x.meaning||"")}</div>
          ${x.example?`<div class="ex">“${esc(x.example)}” — ${esc(x.exampleKo||"")}</div>`:""}
          <div class="meta">${x.date||""}</div>
        </div>
        <button class="del" data-delv="${i}">삭제</button>
      </div>`).join("")
      : emptyState("📖","단어장이 비어 있어요","검사 결과에서 단어를 눌러 뜻을 보고 저장하세요. 단어 시험에는 TOEIC 234단어가 기본 포함돼 있어요."));
    body.querySelectorAll("[data-delv]").forEach(b=>b.onclick=()=>{DB.vocab.splice(+b.dataset.delv,1);saveDB();renderCollection();});
    $("#startTest").onclick=openVocabTest;
  }else{
    body.innerHTML= s.length? s.map((x,i)=>`
      <div class="listitem">
        <div class="main"><div class="sent">“${esc(x.text)}”</div><div class="meta">${x.date||""}</div></div>
        <button class="del" data-dels="${i}">삭제</button>
      </div>`).join("")
      : emptyState("✍️","모은 문장이 없어요","교정 카드의 ‘문장수집에 저장’이나 단어 팝업에서 문장을 저장할 수 있어요.");
    body.querySelectorAll("[data-dels]").forEach(b=>b.onclick=()=>{DB.sentences.splice(+b.dataset.dels,1);saveDB();renderCollection();});
  }
  bindWordTaps(body);
}
function emptyState(em,t,s){return `<div class="empty"><div class="em">${em}</div><div class="t">${t}</div><div class="s">${s}</div></div>`;}

let backTarget=null, curAction=null;
function setChrome({title,back,backTo,action}){
  titleEl.textContent=title;
  backBtn.style.display=back?"flex":"none";
  $("#lspacer").style.display=back?"none":"block";
  backTarget=backTo||null;
  curAction=action||null;
  const ta=$("#topAct"),rs=$("#rspacer");
  if(curAction){ta.textContent=curAction.label;ta.style.display="block";rs.style.display="none";}
  else{ta.style.display="none";rs.style.display="block";}
}
$("#topAct").onclick=()=>{ if(curAction&&curAction.fn)curAction.fn(); };
backBtn.onclick=()=>{
  if(!backTarget){renderToday();switchTab("today");return;}
  if(backTarget==="today"){switchTab("today");renderToday();}
  else if(backTarget==="calendar"){switchTab("calendar");renderCalendar();}
  else if(backTarget==="collection"){switchTab("collection");renderCollection();}
  else if(backTarget.startsWith("reader:")){openReader(backTarget.slice(7));}
};
function switchTab(t){
  curTab=t;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  const t=b.dataset.tab; switchTab(t); closeSheet();
  if(t==="today"){curEntryKey=TODAY_KEY;renderToday();}
  else if(t==="calendar")renderCalendar();
  else if(t==="collection")renderCollection();
  view.scrollTop=0;
});

/* global click delegation for dynamic buttons */
document.addEventListener("click",e=>{
  const cb=e.target.closest("#checkBtn"); if(cb){doCheck();return;}
  const sr=e.target.closest("#seeResult"); if(sr){openResult(TODAY_KEY);return;}
  const opt=e.target.closest(".opt[data-q]"); if(opt&&!opt.disabled){
    const qi=+opt.dataset.q, oi=+opt.dataset.o, e2=getEntry(resultKey);
    if(e2&&e2.quiz){ e2.quizState=e2.quizState||{}; if(e2.quizState[qi]==null){ e2.quizState[qi]=oi; saveDB(); const st=view.scrollTop; renderResult(); view.scrollTop=st; } }
    return;
  }
  const topt=e.target.closest(".opt[data-tq]"); if(topt&&!topt.disabled){
    const qi=+topt.dataset.tq, oi=+topt.dataset.to;
    if(testState&&testState.answers[qi]==null){ testState.answers[qi]=oi; const st=view.scrollTop; renderTest(); view.scrollTop=st; }
    return;
  }
  const ao=e.target.closest("[data-applyone]"); if(ao){
    const e3=getEntry(resultKey||curEntryKey); const idx=+ao.dataset.applyone; const c=e3&&e3.corrections&&e3.corrections[idx];
    if(c){ const done=applyFix(e3,c.original,c.corrected); if(done){ e3.corrections.splice(idx,1); saveDB(); toast("적용했어요"); const st=view.scrollTop; renderResult(); view.scrollTop=st; } else { toast("이미 적용된 문장이에요"); } }
    return;
  }
  const aa=e.target.closest("[data-applyall]"); if(aa){
    const e3=getEntry(resultKey||curEntryKey);
    if(e3){ e3.text=e3.corrected||e3.text; e3.corrections=[]; e3.updatedAt=Date.now(); saveDB(); toast("전체 교정을 적용했어요"); renderResult(); view.scrollTop=0; }
    return;
  }
  const sa=e.target.closest("[data-saveall]"); if(sa){
    const e3=getEntry(resultKey||curEntryKey);
    if(e3){ const sents=splitSentences(e3.corrected||e3.text||""); let n=0; sents.forEach(s=>{ if(s&&!DB.sentences.some(x=>x.text===s)){ DB.sentences.unshift({text:s,date:resultKey||curEntryKey,savedAt:Date.now()}); n++; } }); saveDB(); toast(n?`문장 ${n}개를 저장했어요`:"이미 저장돼 있어요"); }
    return;
  }
});

/* ================= vocab test ================= */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let testState=null, testCfg={source:"all",dir:"mix",count:10};
function poolFor(src){ if(src==="toeic")return TOEIC_SAMPLE.slice(); if(src==="mine")return DB.vocab.slice(); return DB.vocab.concat(TOEIC_SAMPLE); }
function makeQuestions(){
  const distract=DB.vocab.concat(TOEIC_SAMPLE).filter(x=>x.word&&x.meaning);
  let pool=poolFor(testCfg.source).filter(x=>x.word&&x.meaning);
  shuffle(pool); pool=pool.slice(0,testCfg.count);
  return pool.map(it=>{
    const d=testCfg.dir==="mix"?(Math.random()<.5?"en2ko":"ko2en"):testCfg.dir;
    const key=d==="en2ko"?"meaning":"word";
    const prompt=d==="en2ko"?it.word:it.meaning;
    const correct=it[key];
    const seen=new Set([correct]);const dis=[];const others=distract.filter(x=>x!==it);shuffle(others);
    for(const o of others){const val=o[key];if(val&&!seen.has(val)){seen.add(val);dis.push(val);}if(dis.length>=3)break;}
    const opts=shuffle([correct,...dis]);
    return {d,prompt,options:opts,answer:opts.indexOf(correct),word:it.word,meaning:it.meaning};
  });
}
function openVocabTest(){
  if(DB.vocab.length<4 && testCfg.source==="mine")testCfg.source="all";

      <div class="lbl">단어 출처</div>
      <div class="chips">${chip("source","mine","내 단어장")}${chip("source","toeic","TOEIC 샘플")}${chip("source","all","전체")}</div>

      <button class="btn primary" id="regen" style="margin-top:12px">새 문제 내기</button>
    </div>
    ${qs.length?`
      ${done?`<div class="result-big"><div class="sc serif">${score} / ${qs.length}</div><div class="lb">${score===qs.length?"완벽해요! 🎉":score>=qs.length*0.7?"잘했어요 👍":"복습해 볼까요?"}</div></div>`:
        `<div class="qhead" style="margin-top:16px"><span class="n">${answered}/${qs.length} 완료</span><span class="score">${score}점</span></div>`}
      <div id="testBody">${qs.map((q,i)=>testCard(q,i)).join("")}</div>`
      :`<div class="empty"><div class="em">🗂️</div><div class="t">출제할 단어가 부족해요</div><div class="s">‘전체’나 ‘TOEIC 샘플’을 고르거나 단어를 더 저장해 보세요.</div></div>`}

  view.querySelectorAll("[data-cfg]").forEach(b=>b.onclick=()=>{let v=b.dataset.val;testCfg[b.dataset.cfg]=(b.dataset.cfg==="count")?+v:v;regenTest();view.scrollTop=0;});

function testCard(q,i){
  const ans=testState.answers[i];const answered=ans!=null;
  const opts=q.options.map((o,oi)=>{let cls="opt";if(answered){if(oi===q.answer)cls+=" correct";else if(oi===ans)cls+=" wrong";}
    return `<button class="${cls}" ${answered?"disabled":""} data-tq="${i}" data-to="${oi}"><span class="k">${String.fromCharCode(65+oi)}</span><span>${esc(o)}</span></button>`;}).join("");
  const label=q.d==="en2ko"?"알맞은 뜻을 고르세요":"알맞은 영어 단어를 고르세요";
  return `<div class="qcard"><div class="q"><span style="font-size:11px;color:var(--muted);font-weight:700">${label}</span><br><span class="serif" style="font-size:23px">${esc(q.prompt)}</span></div>${opts}
    ${answered?`<div class="qexp"><b>${ans===q.answer?"정답!":"오답"}</b> ${esc(q.word)} = ${esc(q.meaning)}</div>`:""}</div>`;
}

/* ================= CSV export / import ================= */
function csvEsc(v){v=(v==null?"":String(v));return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function toCSV(headers,rows){return [headers.join(","),...rows.map(r=>headers.map(h=>csvEsc(r[h])).join(","))].join("\r\n");}
function parseCSV(text){
  const rows=[];let i=0,f="",row=[],q=false;text=String(text).replace(/^\uFEFF/,"");
  while(i<text.length){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i+=2;continue;}q=false;i++;continue;}f+=c;i++;continue;}
    if(c==='"'){q=true;i++;continue;}
    if(c===','){row.push(f);f="";i++;continue;}
    if(c==='\r'){i++;continue;}
    if(c==='\n'){row.push(f);rows.push(row);row=[];f="";i++;continue;}
    f+=c;i++;
  }
  if(f.length||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>!(r.length===1&&r[0]===""));
}
function rowsToObjects(rows){if(!rows.length)return[];const h=rows[0].map(x=>x.trim());return rows.slice(1).map(r=>{const o={};h.forEach((k,i)=>o[k]=r[i]!=null?r[i]:"");return o;});}
async function exportCSV(kind){
  let headers,rows,name;
  if(kind==="vocab"){headers=["word","pos","meaning","example","exampleKo","date"];rows=DB.vocab;name="wordbook.csv";}
  else if(kind==="sent"){headers=["text","date"];rows=DB.sentences;name="sentences.csv";}
  else{headers=["date","text","corrected"];rows=Object.keys(DB.entries).sort().map(k=>({date:k,text:DB.entries[k].text||"",corrected:DB.entries[k].corrected||""}));name="diary.csv";}
  if(!rows.length){toast("내보낼 데이터가 없어요");return;}
  const csv="\uFEFF"+toCSV(headers,rows);
  let dl=null;try{dl=await claude.use("downloads");}catch(e){}
  if(dl){try{await dl.save({filename:name,data:csv});toast("CSV를 저장했어요");return;}catch(e){if(e&&e.code==="cancelled")return;}}
  showCSVFallback(name,csv);
}
function importCSVText(text){
  const rows=parseCSV(text);if(rows.length<2){toast("CSV 내용을 확인해 주세요");return;}
  const h=rows[0].map(x=>x.trim().toLowerCase());const objs=rowsToObjects(rows);let n=0;
  const get=(o,k)=>o[k]!=null?o[k]:(o[k.toLowerCase()]!=null?o[k.toLowerCase()]:"");
  if(h.includes("word")){
    objs.forEach(o=>{const w=get(o,"word");if(w&&!DB.vocab.some(v=>v.word.toLowerCase()===w.toLowerCase())){DB.vocab.unshift({word:w,pos:get(o,"pos"),meaning:get(o,"meaning"),example:get(o,"example"),exampleKo:get(o,"exampleKo"),date:get(o,"date"),savedAt:Date.now()});n++;}});
    saveDB();toast(`단어 ${n}개를 불러왔어요`);
  }else if(h.includes("corrected")){
    objs.forEach(o=>{const d=get(o,"date");if(d){DB.entries[d]={...(DB.entries[d]||{}),text:get(o,"text"),corrected:get(o,"corrected")||((DB.entries[d]||{}).corrected||""),updatedAt:Date.now()};n++;}});
    saveDB();toast(`일기 ${n}일치를 불러왔어요`);
  }else if(h.includes("text")){
    objs.forEach(o=>{const t=get(o,"text");if(t&&!DB.sentences.some(s=>s.text===t)){DB.sentences.unshift({text:t,date:get(o,"date"),savedAt:Date.now()});n++;}});
    saveDB();toast(`문장 ${n}개를 불러왔어요`);
  }else{toast("알 수 없는 CSV 형식이에요");return;}
  closeSheet();if(curTab==="collection")renderCollection();else if(curTab==="calendar")renderCalendar();
}
$("#csvFile").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>importCSVText(String(rd.result));rd.onerror=()=>toast("파일을 읽지 못했어요");rd.readAsText(f);e.target.value="";});
